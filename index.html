<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Průvodce Mladoboleslavskem</title>
    <style>
        body { font-family: sans-serif; margin: 0; background-color: #f4f4f9; }
        .main-content { display: flex; gap: 20px; padding: 20px; }
        .white-box { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .left-panel { flex: 2; }
        .right-panel { flex: 1; min-height: 200px; }
        
        /* Obal mapy - důležitý pro relativní pozicování bodů */
        .map-wrapper { position: relative; width: 100%; max-width: 600px; margin: 0 auto; }
        .map-img { width: 100%; height: auto; display: block; }

        /* Vzhled interaktivních bodů na mapě */
        .map-point {
            position: absolute;
            width: 16px;
            height: 16px;
            background-color: #e63946;
            border: 2px solid #ffffff;
            border-radius: 50%;
            cursor: pointer;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 5px rgba(0,0,0,0.3);
            transition: transform 0.2s, background-color 0.2s;
        }

        .map-point:hover {
            transform: translate(-50%, -50%) scale(1.3);
            background-color: #ffb703;
        }
    </style>
</head>
<body>

    <main class="main-content">
        <div class="left-panel white-box">
            <div class="map-wrapper">
                <!-- Vykreslená SVG mapa (obrys okresu + řeka) -->
                <svg viewBox="0 0 500 500" class="map-img">
                    <!-- Polygon reprezentující obrys regionu -->
                    <path d="M 180,30 L 340,50 L 450,180 L 410,380 L 260,460 L 90,400 L 60,200 Z" 
                          fill="#e9ecef" stroke="#adb5bd" stroke-width="4"/>
                    
                    <!-- Křivka reprezentující řeku Jizeru -->
                    <path d="M 280,50 Q 220,150 250,250 T 210,430" 
                          fill="none" stroke="#4ea8de" stroke-width="6" stroke-linecap="round"/>
                </svg>
                
                <!-- Body umístěné na konkrétní souřadnice % -->
                <div class="map-point" style="top: 18%; left: 62%;" title="Mnichovo Hradiště" onclick="showInfo('Mnichovo Hradiště', 'Zámek spojený s rodem Valdštejnů.')"></div>
                <div class="map-point" style="top: 50%; left: 50%;" title="Mladá Boleslav" onclick="showInfo('Mladá Boleslav', 'Statutární město známé výrobou automobilů Škoda.')"></div>
                <div class="map-point" style="top: 42%; left: 42%;" title="Michalovice" onclick="showInfo('Michalovická Putna', 'Zřícenina hradu se šikmou věží.')"></div>
                <div class="map-point" style="top: 80%; left: 42%;" title="Benátky nad Jizerou" onclick="showInfo('Benátky nad Jizerou', 'Historický zámek, kde působil Tycho Brahe.')"></div>
            </div>
        </div>

        <div class="right-panel white-box">
            <div id="info-panel">
                <h2 id="p-title">Klikněte na bod na mapě</h2>
                <p id="p-desc">Zde se zobrazí podrobnosti o vybrané památce.</p>
            </div>
        </div>
    </main>

    <script>
        function showInfo(title, desc) {
            document.getElementById('p-title').innerText = title;
            document.getElementById('p-desc').innerText = desc;
        }
    </script>
</body>
</html>
