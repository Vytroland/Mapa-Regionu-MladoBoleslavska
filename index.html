<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Průvodce Mladoboleslavskem</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="top-header">
        <div class="panel">
            <h1>Průvodce Mladoboleslavskem</h1>
        </div>
        <div class="panel">
            <p>Klikněte na body na mapě a objevte historii!</p>
        </div>
    </header>

    <main class="main-content">
        <div class="left-panel white-box">
            <div class="map-wrapper">
                <svg id="Vrstva_1" data-name="Vrstva 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 759.67 1045.43" class="map-img">
                    <!-- Sem patří tvoje SVG cesty (path) -->
                </svg>
                
                <!-- Interaktivní body na mapě -->
                <div class="map-point" data-id="boleslav" style="top: 50%; left: 50%;" title="Mladá Boleslav"></div>
                <div class="map-point" data-id="mnichovo" style="top: 25%; left: 55%;" title="Mnichovo Hradiště"></div>
                <div class="map-point" data-id="bela" style="top: 75%; left: 45%;" title="Benátky nad Jizerou"></div>
                <div class="map-point" data-id="michalovice" style="top: 45%; left: 40%;" title="Michalovická Putna"></div>
                <div class="map-point" data-id="loucen" style="top: 80%; left: 65%;" title="Zámek Loučeň"></div>
            </div>
        </div>

        <div class="right-panel white-box">
            <!-- Dynamický panel pro zobrazení detailu -->
            <div id="info-panel" class="info-overlay" style="display: none;">
                <h2 id="p-title"></h2>
                <img id="p-img" src="" alt="Foto památky">
                <p id="p-desc"></p>
                <button class="close-btn" onclick="hidePanels()">Zavřít</button>
            </div>
        </div>
    </main>
</body>
</html>
